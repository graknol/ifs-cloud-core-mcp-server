# Configuration for Phi-4 Mini Fine-tuning
# Adjust these parameters based on your hardware and requirements

[model]
name = "microsoft/Phi-4"
max_seq_length = 2048
load_in_4bit = true
dtype = null  # Auto-detect

[lora]
r = 16                    # LoRA rank (higher = more parameters, better quality, more memory)
lora_alpha = 16           # LoRA scaling factor (typically same as r)
lora_dropout = 0.1        # Dropout for regularization
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
bias = "none"
use_gradient_checkpointing = "unsloth"
random_state = 42

[training]
# Memory-optimized settings for 16GB VRAM
per_device_train_batch_size = 1    # Small batch size for memory efficiency
gradient_accumulation_steps = 8     # Effective batch size = 8
num_train_epochs = 3               # Number of training epochs
learning_rate = 2e-4               # Learning rate for QLoRA
warmup_steps = 100                 # Warmup steps
weight_decay = 0.01                # Weight decay for regularization
lr_scheduler_type = "cosine"       # Learning rate scheduler
optim = "adamw_8bit"              # 8-bit optimizer for memory savings
logging_steps = 50                # Log every N steps
eval_steps = 200                  # Evaluate every N steps
save_steps = 500                  # Save checkpoint every N steps
save_total_limit = 3              # Keep only N checkpoints

# Hardware optimization
fp16 = null                       # Auto-detect based on hardware
bf16 = null                       # Auto-detect based on hardware
dataloader_num_workers = 0        # Avoid multiprocessing issues

[dataset]
input_file = "plsql_analysis_combined/clean.jsonl"
test_split = 0.1                  # Fraction for validation
random_seed = 42

[output]
model_dir = "phi4_ifs_cloud_final"
save_gguf = true                  # Save in GGUF format for inference
gguf_quantization = "q4_k_m"      # GGUF quantization method

# Notes:
# - Reduce batch_size if you get OOM errors
# - Increase r and lora_alpha for potentially better quality (uses more memory)
# - Adjust max_seq_length based on your average procedure length
# - Set fp16=true manually if you have older hardware without bfloat16 support
